name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No secrets needed: env vars are read at request time, never at build time.
      - run: npm run build

  database:
    name: Database migrations + RLS security tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Apply Supabase stub and migrations
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f tests/db/setup/supabase_stub.sql
          for m in supabase/migrations/*.sql; do
            echo "applying $m"
            psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$m"
          done
      - name: Run RLS / security tests
        run: TEST_DATABASE_URL="$DB_URL" bash scripts/db-test.sh

  e2e:
    name: End-to-end (browser) tests against real Supabase Auth + PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase-compatible stack (Postgres 16 + Auth + PostgREST)
        run: bash scripts/local-stack/start.sh --reset
      - name: Seed demo data
        run: npm run seed:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
